<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3d8064" />
    <title>Offline · Mine</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #fafafa;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #fafafa;
        }
      }
      main {
        max-width: 24rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #737373;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      button {
        border: 0;
        border-radius: 0.625rem;
        background: #3d8064;
        color: white;
        font: inherit;
        font-weight: 600;
        padding: 0.625rem 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum tersimpan di perangkat. Sambungkan internet lalu buka Mine lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
